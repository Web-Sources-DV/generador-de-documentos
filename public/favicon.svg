<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sqp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="sqp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="sqp-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Background Rounded Shield / Tile -->
  <rect width="512" height="512" rx="110" fill="url(#sqp-bg)" stroke="#334155" stroke-width="8" />
  
  <!-- SQP Scales & Shield Symbol -->
  <g transform="translate(256, 256) scale(0.88) translate(-256, -256)" filter="url(#shadow)">
    <!-- Outer Golden Crest / Wings -->
    <path fill="url(#sqp-gold)" d="M256,64 C320,64 380,85 416,120 C380,140 330,160 256,160 C182,160 132,140 96,120 C132,85 192,64 256,64 Z" />
    
    <!-- Central Pillar / Scale Balance -->
    <path fill="url(#sqp-gold)" d="M246,140 L266,140 L266,380 L246,380 Z" />
    <circle cx="256" cy="140" r="14" fill="#fbbf24" />
    <rect x="216" y="380" width="80" height="16" rx="8" fill="url(#sqp-gold)" />
    <rect x="236" y="398" width="40" height="12" rx="6" fill="#b45309" />
    
    <!-- Balance Beam -->
    <path fill="url(#sqp-gold)" d="M120,175 C180,168 332,168 392,175 C394,183 388,188 380,187 C330,180 182,180 132,187 C124,188 118,183 120,175 Z" />
    
    <!-- Left Scale Bowl -->
    <g transform="translate(130, 185)">
      <line x1="-35" y1="0" x2="-20" y2="70" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />
      <line x1="35" y1="0" x2="20" y2="70" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />
      <path d="M-45,70 C-45,105 45,105 45,70 Z" fill="url(#sqp-blue)" stroke="#38bdf8" stroke-width="4" />
    </g>
    
    <!-- Right Scale Bowl -->
    <g transform="translate(382, 185)">
      <line x1="-35" y1="0" x2="-20" y2="70" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />
      <line x1="35" y1="0" x2="20" y2="70" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />
      <path d="M-45,70 C-45,105 45,105 45,70 Z" fill="url(#sqp-blue)" stroke="#38bdf8" stroke-width="4" />
    </g>
    
    <!-- Elegant SQP Letters Monogram -->
    <text x="256" y="465" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="44" font-weight="900" fill="#fcd34d" text-anchor="middle" letter-spacing="8">SQP</text>
  </g>
</svg>
